<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ปุ่มล้อเล่น</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background: #007bff;
            color: white;
        }

        #result {
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #d60000;
        }
    </style>
</head>
<body>

    <button onclick="showMessage()">กดที่นี่</button>

    <div id="result"></div>

    <script>
        function showMessage() {
            document.getElementById("result").textContent = "ใครกดหำใหญ่ ";
        }
    </script>

</body>
</html>
